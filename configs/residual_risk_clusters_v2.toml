baseline_version = "residual_risk_clusters_v2"
pipeline = "residual_risk_clusters"
project_root = ".."
python = ".venv/bin/python"
script = "../scripts/cluster_residual_risk.py"
output_root = "../runs"

[inputs]
universe = "data/universes/2026-08-26/lbb_stocks_620.csv"

[model]
as_of = "2026-08-26"
